{{define "head"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · {{.Pack.Company.Name}}</title>
<meta name="description" content="{{.Pack.Company.Description}}">
{{with .Pack.Company.AnalyticsID}}<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id={{.}}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', '{{.}}');
</script>{{end}}
<style>
:root{--bg:#0b0d12;--fg:#e6e8ee;--muted:#9aa3b2;--card:#141821;--line:#232937;--accent:#7c9cff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
a{color:var(--accent);text-decoration:none}header,main,footer{max-width:1040px;margin:0 auto;padding:20px}
header{display:flex;justify-content:space-between;align-items:center}nav a{margin-left:20px;color:var(--muted)}
.logo{font-weight:700;color:var(--fg)}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;margin:16px 0}
table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left}
pre{background:#0f1219;border:1px solid var(--line);border-radius:8px;padding:14px;overflow-x:auto;font-size:13px}
input{background:#0f1219;border:1px solid var(--line);color:var(--fg);padding:10px;border-radius:6px;width:100%;margin:6px 0}
button{background:var(--accent);color:#0b0d12;border:0;padding:10px 18px;border-radius:6px;font-weight:600;cursor:pointer}
.muted{color:var(--muted)}.msg{color:#ffcf6b}footer{color:var(--muted);font-size:13px;border-top:1px solid var(--line);margin-top:40px}
</style>
</head>
<body>
<header><a class="logo" href="https://{{.Domain}}/">{{.Pack.Company.Name}}</a>
<nav><a href="https://{{.Domain}}/pricing">Pricing</a><a href="https://docs.{{.Domain}}/">Docs</a><a href="https://{{.Domain}}/changelog">Changelog</a><a href="https://status.{{.Domain}}/">Status</a><a href="https://console.{{.Domain}}/">Console</a></nav></header>
<main>
{{end}}
{{define "foot"}}</main>
<script src="/assets/app.js" data-v="{{.ViewID}}" defer></script>
<footer>© 2026 {{.Pack.Company.Name}} · Public beta · <a href="https://{{.Domain}}/privacy">Privacy</a> · <a href="https://{{.Domain}}/terms">Terms</a> · <a href="https://{{.Domain}}/contact">Contact</a></footer>
</body>
</html>
{{end}}
